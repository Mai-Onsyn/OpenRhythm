#Gradle
# The JDK default trust store (cacerts) is used on Linux/macOS.
# NOTE: the Windows-only flags below cannot be used on Linux (they make every
# HTTPS request fail with "Could not initialize SSL context"):
#   -Djavax.net.ssl.trustStoreType=Windows-ROOT -Djavax.net.ssl.trustStore=NULL
# On Windows, re-add them to the end of this line if you rely on certificates
# from the Windows certificate store (e.g. a corporate TLS proxy).
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true

#Kotlin
kotlin.daemon.jvmargs=-Xmx4G
kotlin.native.binary.gc=cms

#Android
android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

compose.hot-reload.enabled=false